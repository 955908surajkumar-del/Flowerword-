<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ✅ SEO META TAG -->
<meta name="description" content="Download beautiful flower images free with details. Explore 2000+ flower photos with easy download option.">

<title>Flower World</title>

<style>
html,body{margin:0;padding:0;font-family:Arial;background:#f1f3f6}

/* BANNER */
.banner{background:#4CAF50;color:white;text-align:center;padding:15px;font-size:20px}

/* HERO */
.hero{
background:url("https://picsum.photos/800/400?flower") center/cover;
color:white;
text-align:center;
padding:60px 10px;
}

/* SEARCH */
.search{padding:10px}
.search input{width:100%;padding:12px;border-radius:25px;border:1px solid #ccc}

/* CATEGORY */
.category{display:flex;gap:10px;overflow:auto;padding:10px}
.cat{background:white;padding:8px 15px;border-radius:20px;cursor:pointer}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card img{width:100%;height:140px;object-fit:cover}
.card p{text-align:center;margin:5px}

/* MODAL */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
display:none;
overflow:auto;
}

.top{
position:sticky;
top:0;
background:#4CAF50;
color:white;
padding:10px;
display:flex;
justify-content:space-between;
}

/* CONTENT */
.content img{
width:100%;
margin-top:10px;
border-radius:8px;
}

/* SMALL DOWNLOAD */
.download{
display:inline-block;
margin:5px 10px;
font-size:14px;
background:#4CAF50;
color:white;
padding:5px 10px;
border-radius:20px;
text-decoration:none;
}

/* TEXT */
.text{
padding:10px;
line-height:1.6;
font-size:14px;
}
</style>
</head>

<body>

<div class="banner">🌸 Flower World</div>

<div class="hero">
<h2>Welcome to Flower World</h2>
</div>

<div class="search">
<input id="search" placeholder="Search flowers...">
</div>

<div class="category">
<div class="cat" onclick="filter('all')">All</div>
<div class="cat" onclick="filter('rose')">Rose</div>
<div class="cat" onclick="filter('lotus')">Lotus</div>
<div class="cat" onclick="filter('sunflower')">Sunflower</div>
<div class="cat" onclick="filter('tulip')">Tulip</div>
<div class="cat" onclick="filter('lily')">Lily</div>
<div class="cat" onclick="filter('daisy')">Daisy</div>
<div class="cat" onclick="filter('orchid')">Orchid</div>
<div class="cat" onclick="filter('hibiscus')">Hibiscus</div>
</div>

<div class="gallery" id="gallery"></div>

<!-- DETAIL -->
<div class="modal" id="modal">
<div class="top">
<span onclick="closeModal()">⬅ Back</span>
</div>

<div id="content"></div>
</div>

<script>

let base=[
"rose","lotus","sunflower","tulip","lily","daisy","orchid","hibiscus",
"marigold","lavender","jasmine","peony","iris","poppy","magnolia",
"petunia","zinnia","carnation","dahlia","bluebell"
];

// 2000 flowers
let flowers=[];
for(let i=0;i<2000;i++){
flowers.push(base[i % base.length]);
}

let gallery=document.getElementById("gallery");

// LOAD
function load(list){
gallery.innerHTML="";
list.forEach(name=>{
let img="https://loremflickr.com/300/300/"+name+"?"+Math.random();

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${img}">
<p>${name}</p>
`;

div.onclick=()=>openDetail(name);

gallery.appendChild(div);
});
}

load(flowers);

// SEARCH
document.getElementById("search").addEventListener("input",function(){
let v=this.value.toLowerCase();
load(flowers.filter(f=>f.includes(v)));
});

// FILTER
function filter(type){
if(type=="all") load(flowers);
else load(flowers.filter(f=>f==type));
}

// DETAIL
function openDetail(name){
document.getElementById("modal").style.display="block";

let content=document.getElementById("content");
content.innerHTML="";

for(let i=0;i<50;i++){
let img="https://loremflickr.com/400/400/"+name+"?"+i;

content.innerHTML+=`
<img src="${img}">
<a href="${img}" download class="download">⬇</a>
<div class="text">
This ${name} flower is known for its natural beauty, soft petals, and pleasant fragrance. It grows in gardens, parks, and natural environments. Flowers play an important role in nature by attracting bees, butterflies, and birds. They are widely used in decoration, perfumes, and traditional uses. Many people love these flowers because they bring freshness, color, and positivity to surroundings.
</div>
`;
}
}

// CLOSE
function closeModal(){
document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
